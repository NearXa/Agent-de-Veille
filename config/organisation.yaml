  effectif: 800
  secteur: "Gestion d'actifs"
  description: >
    Société de gestion de portefeuille fictive agréée par l'AMF, gérant des OPCVM et des FIA
    pour une clientèle institutionnelle et de distribution. Environ 800 salariés, un datacenter
    principal en Île-de-France et un recours croissant au cloud public pour les applications
    métier et l'analyse de données.
